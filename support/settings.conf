# Compare in Word — your Comparison Settings.
#
# Opening the dialog programmatically makes Word build a fresh one with factory
# defaults instead of loading your sticky preferences, so they are restored from
# here on every run. Seeded from your preferred configuration.
#
# 1 = checked, 0 = unchecked. Delete a line to leave that control untouched.
# Delete or rename this whole file to stop the script touching settings at all.

Case changes=1
Comments=0
Fields=0
Footnotes and endnotes=1
Formatting=0
Headers and footers=1
Moves=1
Tables=1
Textboxes=1
White space=0

# Show Changes At:  Character level | Word level
At=Character level

# Show Changes In:  Original document | Revised document | New document
# Note: "Revised document" marks up the revised file in place rather than
# producing a separate redline document.
In=Revised document

# Press OK automatically once both documents and all settings are in place.
# Set to 0 if you would rather check the dialog over and click OK yourself.
AutoClickOK=1
